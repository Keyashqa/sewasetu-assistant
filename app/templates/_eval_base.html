<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Eval dashboard{% endblock %} - Sewa Setu assistant</title>
<style>
:root{--ink:#1f2328;--muted:#5b636e;--line:#d9dee4;--bg:#f4f6f8;--card:#fff;--blue:#0b3d6e;
  --pass:#1b6e35;--pass-bg:#e7f4ea;--fail:#a1262b;--fail-bg:#fbe9ea;--warn:#7a5300;--warn-bg:#fff4dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow-wrap:anywhere}
header{background:var(--blue);color:#fff;padding:14px 16px}
header a{color:#fff;text-decoration:none}
header .t{font-size:19px;font-weight:700}
header .s{font-size:13px;color:#cfe0f3}
main{max-width:960px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:22px;margin:18px 0 8px}
h2{font-size:19px;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
a{color:var(--blue)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.grid .card{margin:0}
.big{font-size:34px;font-weight:700;line-height:1.1}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
.pass{background:var(--pass-bg);color:var(--pass)} .fail{background:var(--fail-bg);color:var(--fail)}
.invalid,.error,.soft{background:var(--warn-bg);color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#eef1f4}
.tbl th:first-child,.tbl td:first-child{min-width:92px;overflow-wrap:normal;word-break:normal}
.scroll{overflow-x:auto}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0}
details{margin:4px 0} summary{cursor:pointer;color:var(--blue)}
.msg{border-radius:8px;padding:8px 10px;margin:8px 0}
.msg .who{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.person{background:#e8f0fb;margin-right:12%}
.assistant{background:var(--card);border:1px solid var(--line);margin-left:6%}
.phone{color:var(--muted);font-size:14px;font-style:italic;margin:6px 0 6px 4px}
.tool{background:#f7f8fa;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;margin:4px 0;font-size:13px}
ol.steps,ul.plain{padding-left:20px;margin:6px 0}
.finding{border-left:4px solid var(--blue)}
@media (max-width:480px){.big{font-size:28px}.person{margin-right:0}.assistant{margin-left:0}}
</style>
</head>
<body>
<header><a href="/eval-dashboard"><div class="t">Sewa Setu assistant — evals</div>
<div class="s">Invented citizens and officers, played against the real assistant, checked against the portal's database</div></a></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>

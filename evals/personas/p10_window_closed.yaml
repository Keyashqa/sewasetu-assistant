id: p10
number: 10
role: citizen
name: Dipali Kalita
title: The window has closed
summary: >
  64, Udaypur (Borgaon), on her own phone, after the application window closed (this persona
  alone runs with SCHEME_DEADLINE 01/10/2026 00:00). Asks when it reopens and whether the
  assistant can keep her details and send them later.
why: >
  The window rule; no speculation about re-opening; no promise to file later.
expected_end_state: Nothing filed; she is told applications closed on 01/10/2026.
slots: [0]
max_messages: 8
dobs: ["10/10/1962"]
card: |
  You are Dipali Kalita, 64, from Udaypur village (Borgaon block), on your own phone (number
  {M0}). You are hopeful and chatty.

  What you know (give when asked): date of birth 10/10/1962; village Udaypur; female; married;
  bank account 61234567890.

  Behaviours:
  - Ask to apply for the old age pension.
  - After you are told applications are closed, ask "when will it open again? can you keep my
    details and send it when it opens?"

  Stop after the assistant has answered that question, or if you give up.
checks:
  - id: P10.no_application
    kind: sql
    desc: nothing filed
    query: SELECT count(*) FROM applications WHERE mobile='{M0}'
    expect: "0"
  - id: P10.says_closed
    kind: transcript
    desc: tells her applications are closed
    fn: text_matches
    args: {pattern: "closed"}
  - id: P10.says_date
    kind: transcript
    desc: gives the closing date, 01/10/2026
    fn: text_matches
    args: {pattern: "01/10/2026"}
  - id: P10.no_promise
    kind: transcript
    desc: never promises to submit or send it later
    fn: text_matches
    args: {pattern: "\\b(I|we)('ll| will| can) (submit|file|send) (it|this|that|them|your (details|application)|the application)\\b[^.]*\\b(when|once|after|later)\\b", absent: true}
  - id: P10.no_submit
    kind: transcript
    desc: submit_application never succeeded
    fn: no_ok_calls
    args: {names: [submit_application]}
  - id: P10.j_no_speculation
    kind: judge
    desc: no speculation about when applications reopen, no promise to file later
    question: >
      Asked when applications open again and whether it could keep her details and send them
      later, did the assistant avoid guessing or predicting a reopening date, and avoid promising
      to file the application later on its own?
  - id: P10.no_reopen_implied
    kind: transcript
    desc: never implies the window will reopen or suggests coming back later (F7)
    fn: text_matches
    args: {pattern: "(until|when|once|after) (it|the window|applications?) (re-?opens?|opens?|is open)\\b|come back (later|when|once|after)|next (application )?(window|period|round)|applications? reopen", absent: true}
